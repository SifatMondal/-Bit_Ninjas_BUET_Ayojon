version: '3.9'

services:
  postgres:
    image: ankane/pgvector:latest
    container_name: ayojon_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ayojon
      POSTGRES_PASSWORD: ayojon_dev_password
      POSTGRES_DB: ayojon_dev
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/init-db.sql:/docker-entrypoint-initdb.d/init-db.sql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ayojon']
      interval: 10s
      timeout: 5s
      retries: 5

  # Uncomment to run the Next.js app in Docker
  # app:
  #   build:
  #     context: .
  #     dockerfile: Dockerfile
  #   container_name: ayojon_app
  #   restart: unless-stopped
  #   ports:
  #     - '3000:3000'
  #   environment:
  #     DATABASE_URL: postgresql://ayojon:ayojon_dev_password@postgres:5432/ayojon_dev
  #   depends_on:
  #     postgres:
  #       condition: service_healthy
  #   env_file:
  #     - .env.local

volumes:
  postgres_data:
