version: '3.9'

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: ayojon-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ayojon
      POSTGRES_PASSWORD: ayojon_dev_password
      POSTGRES_DB: ayojon_db
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/init-db.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ayojon']
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: ayojon-redis
    restart: unless-stopped
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes

volumes:
  postgres_data:
  redis_data:
